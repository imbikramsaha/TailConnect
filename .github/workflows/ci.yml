name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Linux window deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet ./...
        env:
          CGO_CXXFLAGS: -Wno-deprecated-literal-operator
      - name: Vet Linux window helper
        if: runner.os == 'Linux'
        run: go vet -tags webkit ./internal/window ./cmd/tailconnect-window
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 20m ./...
        env:
          CGO_CXXFLAGS: -Wno-deprecated-literal-operator
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 20m ./...

  macos:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: scripts/build-macos.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Inno Setup
        run: command -v iscc || [ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup -y --no-progress
      - run: scripts/build-windows.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-windows-setup.exe
            dist/*-windows-amd64.zip

  linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/build-linux.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and Homebrew cask
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          V="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum "dist/TailConnect-$V-macos.dmg" | cut -d' ' -f1)
          sed -e "s/\"VERSION\"/\"$V\"/" -e "s/\"SHA256\"/\"$SHA\"/" packaging/homebrew/tailconnect.rb > dist/tailconnect.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
