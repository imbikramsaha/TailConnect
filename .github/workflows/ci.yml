name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Cross-compile
        if: runner.os == 'Linux'
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/tailconnect
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/tailconnect

  macos-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/build-macos.sh "${GITHUB_REF_NAME}"
      - name: Homebrew cask
        run: scripts/update-cask.sh "${GITHUB_REF_NAME#v}" | tee dist/tailconnect.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/tailconnect.rb
          prerelease: true
          generate_release_notes: true
