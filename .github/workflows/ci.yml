name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); update them
# deliberately. Release builds never use the shared Go cache.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Linux window deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet ./...
        env:
          CGO_CXXFLAGS: -Wno-deprecated-literal-operator
      - name: Vet Linux window helper
        if: runner.os == 'Linux'
        run: go vet -tags webkit ./internal/window ./cmd/tailconnect-window
      - name: Known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout 20m ./...
        env:
          CGO_CXXFLAGS: -Wno-deprecated-literal-operator
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 20m ./...
      - name: Check install.sh
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh scripts/install.sh
          # Installers run under any locale (macOS sh is bash 3.2, Windows
          # PowerShell may decode as Latin-1): keep them pure ASCII.
          if LC_ALL=C grep -n '[^ -~	]' scripts/install.sh scripts/install.ps1; then
            echo "::error::install scripts must be ASCII-only"; exit 1
          fi
      - name: Check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e.Count) { $e | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  check-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Tag must be a plain version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $GITHUB_REF_NAME"; exit 1; }

  macos:
    needs: [test, check-tag]
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/build-macos.sh "${GITHUB_REF_NAME}"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    needs: [test, check-tag]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Inno Setup (preinstalled on the runner image)
        run: '[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || { echo "Inno Setup 6 missing from runner image"; exit 1; }'
      - run: scripts/build-windows.sh "${GITHUB_REF_NAME}"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*-windows-setup.exe
            dist/*-windows-amd64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/*-windows-setup.exe
            dist/*-windows-amd64.zip

  linux:
    needs: [test, check-tag]
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/build-linux.sh "${GITHUB_REF_NAME}"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # Creates a DRAFT release. Installed apps ignore drafts and only accept
  # updates whose SHA256SUMS carry the maintainer's offline signature, which
  # scripts/publish-release.sh adds before publishing.
  draft-release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Stable download names and install scripts
        # README links use releases/latest/download/<stable name>.
        run: |
          V="${GITHUB_REF_NAME#v}"
          one() { set -- $1; [ -f "$1" ] || { echo "missing $1" >&2; exit 1; }; echo "$1"; }
          cp "$(one "dist/TailConnect-$V-macos.dmg")"            dist/TailConnect-macos.dmg
          cp "$(one "dist/TailConnect-$V-windows-setup.exe")"    dist/TailConnect-windows-setup.exe
          cp "$(one "dist/TailConnect-$V-windows-amd64.zip")"    dist/TailConnect-windows-amd64.zip
          cp "$(one "dist/tailconnect_*_amd64.deb")"             dist/tailconnect_linux_amd64.deb
          cp "$(one "dist/tailconnect_*_arm64.deb")"             dist/tailconnect_linux_arm64.deb
          cp "$(one "dist/tailconnect-*.x86_64.rpm")"            dist/tailconnect_linux_x86_64.rpm
          cp "$(one "dist/tailconnect-*.aarch64.rpm")"           dist/tailconnect_linux_aarch64.rpm
          cp "$(one "dist/tailconnect_*_linux_amd64.tar.gz")"    dist/tailconnect_linux_amd64.tar.gz
          cp "$(one "dist/tailconnect_*_linux_arm64.tar.gz")"    dist/tailconnect_linux_arm64.tar.gz
          cp scripts/install.sh scripts/install.ps1 dist/
      - name: Provenance for install scripts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/install.sh
            dist/install.ps1
      - name: Checksums and Homebrew cask
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          V="${GITHUB_REF_NAME#v}"
          SHA=$(sha256sum "dist/TailConnect-$V-macos.dmg" | cut -d' ' -f1)
          sed -e "s/\"VERSION\"/\"$V\"/" -e "s/\"SHA256\"/\"$SHA\"/" packaging/homebrew/tailconnect.rb > dist/tailconnect.rb
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "TailConnect ${GITHUB_REF_NAME#v}"
