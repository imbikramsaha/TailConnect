name: RustDesk setup test

# Runs TailConnect's real elevated RustDesk setup ("tailconnect rustdesk-admin")
# on clean machines: download from RustDesk's GitHub release, checksum and
# signature checks, install, and configuration. Runs when that code changes,
# weekly (RustDesk releases change), and on demand.
on:
  push:
    branches: [main]
    paths:
      - internal/rustdesk/**
      - internal/launch/screen.go
      - .github/workflows/rustdesk-test.yml
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 2"

permissions:
  contents: read

env:
  # GitHub rate-limits anonymous API calls from shared runner addresses.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the CLI
        shell: bash
        run: |
          # macOS needs cgo (menu bar, notifications); the others don't.
          if [ "$RUNNER_OS" = macOS ]; then go build -o tc ./cmd/tailconnect
          else CGO_ENABLED=0 go build -o tc$([ "$RUNNER_OS" = Windows ] && echo .exe) ./cmd/tailconnect; fi

      - name: Root-only file-handling tests (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          go test -c -o rdtest ./internal/rustdesk
          sudo TAILCONNECT_ROOT_TESTS=1 ./rdtest -test.run Root -test.v

      - name: Elevated setup (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p spec && chmod 700 spec
          uid=0; [ "$RUNNER_OS" = macOS ] && uid=$(id -u)
          PREFS="$HOME/Library/Preferences/com.carriez.RustDesk"
          if [ "$RUNNER_OS" = macOS ]; then
            # Recreate what TailConnect 0.3.9 left behind: a root-owned
            # settings file in the user's RustDesk folder (setup must repair it).
            mkdir -p "$PREFS" && sudo sh -c "printf '[options]\n' > '$PREFS/RustDesk2.toml' && chmod 600 '$PREFS/RustDesk2.toml'"
            ls -la "$PREFS"
          fi
          printf '{"password":"TcCiTest1234567890ab","lock":true,"uid":%s}' "$uid" > spec/spec.json
          chmod 600 spec/spec.json
          sudo GITHUB_TOKEN="$GITHUB_TOKEN" ./tc rustdesk-admin "$PWD/spec/spec.json"
          cat spec/spec.json.result; echo
          test ! -e spec/spec.json   # the password file is removed
          grep -q '"installed":true' spec/spec.json.result
          ! grep -q '"error"' spec/spec.json.result || { echo "setup reported an error (expected on headless runners for some steps)"; }
          RD=/usr/bin/rustdesk; [ "$RUNNER_OS" = macOS ] && RD=/Applications/RustDesk.app/Contents/MacOS/RustDesk
          test "$(sudo $RD --option direct-server)" = Y
          test "$(sudo $RD --option whitelist)" = "127.0.0.1,::1"
          test "$(sudo $RD --option approve-mode)" = password
          if [ "$RUNNER_OS" = macOS ]; then
            ls -la "$PREFS"
            # Nothing in the user's RustDesk settings may be left owned by root.
            test -z "$(find "$PREFS" -user root)" || { echo "root-owned files left in $PREFS"; exit 1; }
            listening() { nc -z -G 2 127.0.0.1 21118 2>/dev/null; }
            wait_listen() { for i in $(seq 30); do listening && return 0; sleep 1; done; echo "RustDesk isn't listening on 21118"; tail -30 ~/Library/Logs/RustDesk/RustDesk_rCURRENT.log; return 1; }
            wait_listen
            grep -q '"passwordSet":true' spec/spec.json.result

            # What TailConnect 0.3.9 left on Macs: RustDesk running with
            # settings it can't read (so not listening), root-owned log
            # folders. Plus a hard link to a system file planted where the
            # repair looks: it must stay root's.
            pkill -x RustDesk || true; sleep 2
            sudo chown root "$PREFS/RustDesk2.toml"
            sudo mkdir -p ~/Library/Logs/RustDesk/option && sudo sh -c "echo x > '$HOME/Library/Logs/RustDesk/option/RustDesk_rCURRENT.log'"
            sudo sh -c 'echo system > /private/tmp/tc-system-file && chmod 600 /private/tmp/tc-system-file'
            if ln /private/tmp/tc-system-file "$PREFS/RustDesk9.toml"; then planted=1; else planted=0; echo "hard link refused here"; fi
            open -g -j -a RustDesk; sleep 8
            ! listening || { echo "expected RustDesk not to listen with unreadable settings"; exit 1; }

            printf '{"password":"TcCiTest1234567890ab","lock":true,"uid":%s}' "$uid" > spec/spec3.json && chmod 600 spec/spec3.json
            sudo GITHUB_TOKEN="$GITHUB_TOKEN" ./tc rustdesk-admin "$PWD/spec/spec3.json"; cat spec/spec3.json.result; echo
            grep -q '"passwordSet":true' spec/spec3.json.result
            wait_listen
            ls -la "$PREFS" ~/Library/Logs/RustDesk/option
            # The planted link loses only its name; the system file is untouched.
            test "$(stat -f %u /private/tmp/tc-system-file)" = 0 || { echo "system file handed to the user"; exit 1; }
            test "$(cat /private/tmp/tc-system-file)" = system || { echo "system file changed"; exit 1; }
            test ! -e "$PREFS/RustDesk9.toml" || { echo "planted link left"; exit 1; }
            test -z "$(find "$PREFS" ~/Library/Logs/RustDesk/option -user root)" || { echo "root-owned files left"; exit 1; }
            # RustDesk runs as root during setup: only an administrator may change it.
            test -z "$(find /Applications/RustDesk.app ! -user root -print -quit)" || { echo "RustDesk.app not root-owned"; exit 1; }

            # Quit RustDesk: TailConnect starts it when a device connects.
            pkill -x RustDesk || true; sleep 2
            go test -c -o rdtest ./internal/rustdesk
            TAILCONNECT_LIVE_RUSTDESK=1 ./rdtest -test.run StartOnDemandLive -test.v
            # A changed RustDesk app is never run as root: setup installs it afresh.
            sudo sh -c 'echo changed >> /Applications/RustDesk.app/Contents/Info.plist'
          fi
          # Running again (e.g. "Set up again") keeps working on an installed RustDesk.
          printf '{"password":"TcCiTest1234567890ab","lock":false,"uid":%s}' "$uid" > spec/spec2.json && chmod 600 spec/spec2.json
          sudo GITHUB_TOKEN="$GITHUB_TOKEN" ./tc rustdesk-admin "$PWD/spec/spec2.json" && cat spec/spec2.json.result; echo
          test -z "$(sudo $RD --option whitelist)"
          if [ "$RUNNER_OS" = macOS ]; then
            grep -q '"installed":true' spec/spec2.json.result || { echo "changed RustDesk app wasn't reinstalled"; exit 1; }
            codesign --verify --deep --strict /Applications/RustDesk.app
          fi
          # A spec claiming another user's ID is refused.
          printf '{"lock":true,"uid":%s}' "$((uid + 1))" > spec/spec4.json && chmod 600 spec/spec4.json
          if [ "$uid" != 0 ]; then ! sudo ./tc rustdesk-admin "$PWD/spec/spec4.json" || { echo "spec for another user accepted"; exit 1; }; fi

      - name: Elevated setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory spec | Out-Null
          $spec = Join-Path (Resolve-Path spec).Path "spec.json"
          [IO.File]::WriteAllText($spec, '{"password":"TcCiTest1234567890ab","lock":true,"uid":0}')
          .\tc.exe rustdesk-admin $spec
          if ($LASTEXITCODE -ne 0) { throw "rustdesk-admin failed" }
          $res = Get-Content -Raw "$spec.result"; $res
          if (Test-Path $spec) { throw "password file not removed" }
          $r = $res | ConvertFrom-Json
          if (-not $r.installed) { throw "not installed" }
          if (-not $r.passwordSet) { throw "password not set" }
          if ($r.error) { throw "setup error: $($r.error)" }
          $rd = "C:\Program Files\RustDesk\rustdesk.exe"
          function opt($k) { $p = Start-Process $rd -ArgumentList "--option $k" -PassThru -RedirectStandardOutput o.txt; $null = $p.Handle; $null = $p.WaitForExit(60000); (Get-Content -Raw o.txt).Trim() }
          if ((opt direct-server) -ne "Y") { throw "direct access not on" }
          if ((opt whitelist) -ne "127.0.0.1,::1") { throw "not locked" }
          if ((opt verification-method) -ne "use-permanent-password") { throw "verification method not set" }
          Start-Sleep 5
          if (-not (Get-NetTCPConnection -State Listen -LocalPort 21118 -ErrorAction SilentlyContinue)) { throw "RustDesk isn't listening on 21118" }
